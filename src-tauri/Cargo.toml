[package]
name = "filera"
version = "0.4.43"
description = "Batch rename your files with ease"
authors = ["joncorv"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filera_lib"

[[bench]]
harness = false
name = "example"

[dependencies]
clippy = "0.0.302"
divan = "0.1.21"
natord = "1.0.9"
notifica = "3.0.2"
notify-rust = "4.11.7"
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-devtools = "2.0.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
time = { version = "0.3.41", features = ["parsing"] }
walkdir = "2.5.0"

[dev-dependencies]
divan = "0.1.21"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
