[package]
name = "filera"
version = "0.4.49"
description = "Rename, move, and organize files in bulk"
authors = ["joncorv"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "filera_lib"

[[bench]]
harness = false
name = "benches"

[dependencies]
anyhow = "1.0.104"
divan = "0.1.21"
natord = "1.0.9"
notify-rust = "4.19.0"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = ["test"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
time = { version = "0.3.41", features = ["parsing"] }
walkdir = "2.5.0"
# notifica = "3.0.2"
# tauri-plugin-devtools = "2.*"

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
